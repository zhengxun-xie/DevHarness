# dsh-devreviewer bundle patch: inserts the dual-face plugin row into
# the web profile roster. The node half (exports ".") runs in the DSH host
# process and serves /api/devreviewer/* over loopback; the dsh.client declaration
# in package.json makes the browser half (exports "./client", served at
# /plugins/dsh-devreviewer/client.js) load in the web GUI, where it
# registers a review tab into the RIGHT sidebar via the two-phase
# sidebarRightTabs.register + slots.inject('sidebar.right.pane.tab') flow.
#
# It coexists with the left-sidebar implementation: distinct bundle id,
# distinct API prefix (/api/devreviewer vs /api/devreviewer-left), sharing the same
# on-disk project registry (~/.dsh/devbuddy/registry.json) and the same
# project directories (reviews live under <project>/.devbuddy/reviews/).
- insert:
    - id: devreviewer
      name: 'dsh-devreviewer'
